<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00918e" />
  <title>MTrack — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    main { width: min(440px, 100%); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 18px 45px rgba(0,0,0,.35); }
    h1 { margin: 24px 0 8px; font-size: 28px; letter-spacing: -.04em; }
    p { margin: 0 auto; color: #94a3b8; line-height: 1.6; }
    button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 18px; background: #2dd4bf; color: #0f172a; font: inherit; font-weight: 800; cursor: pointer; }
    .status { margin-top: 16px; font-size: 12px; color: #5eead4; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="MTrack" />
    <h1>You’re currently offline</h1>
    <p>MTrack will reconnect automatically. Previously opened ticket data remains available when it has been cached on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="status">No changes have been discarded.</div>
  </main>
</body>
</html>
